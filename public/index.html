<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mongo MCP Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="logo">
        <h1>Mongo MCP</h1>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item active" data-type="all">
          <span class="icon">📊</span> Overview
        </a>
        <a href="#" class="nav-item" data-type="Memories">
          <span class="icon">🧠</span> Memories
        </a>
        <a href="#" class="nav-item" data-type="Skills">
          <span class="icon">⚡</span> Skills
        </a>
        <a href="#" class="nav-item" data-type="Rules">
          <span class="icon">📋</span> Rules
        </a>
        <a href="#" class="nav-item" data-type="MCPs">
          <span class="icon">🔌</span> MCPs
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="generateEmbeddings" class="btn btn-secondary">
          Generate Embeddings
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶部搜索栏 -->
      <header class="header">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Semantic search..." />
          <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>
        <button id="addNew" class="btn btn-primary">+ New</button>
      </header>

      <!-- 统计卡片 -->
      <section id="statsSection" class="stats-section">
        <div class="stat-card" data-type="Memories">
          <span class="stat-value" id="statMemories">0</span>
          <span class="stat-label">Memories</span>
        </div>
        <div class="stat-card" data-type="Skills">
          <span class="stat-value" id="statSkills">0</span>
          <span class="stat-label">Skills</span>
        </div>
        <div class="stat-card" data-type="Rules">
          <span class="stat-value" id="statRules">0</span>
          <span class="stat-label">Rules</span>
        </div>
        <div class="stat-card" data-type="MCPs">
          <span class="stat-value" id="statMCPs">0</span>
          <span class="stat-label">MCPs</span>
        </div>
      </section>

      <!-- 文档列表 -->
      <section class="content-section">
        <div class="content-header">
          <h2 id="contentTitle">All Documents</h2>
          <div class="filters">
            <select id="tagFilter">
              <option value="">All Tags</option>
            </select>
          </div>
        </div>
        <div id="documentList" class="document-list">
          <!-- 文档列表将由 JS 动态生成 -->
        </div>
      </section>
    </main>

    <!-- 详情/编辑面板 -->
    <aside id="detailPanel" class="detail-panel hidden">
      <div class="panel-header">
        <h3 id="panelTitle">Document Details</h3>
        <button id="closePanel" class="btn-icon">&times;</button>
      </div>
      <form id="documentForm" class="panel-content">
        <input type="hidden" id="docId" />
        <div class="form-group">
          <label for="docType">Type</label>
          <select id="docType" required>
            <option value="Memories">Memories</option>
            <option value="Skills">Skills</option>
            <option value="Rules">Rules</option>
            <option value="MCPs">MCPs</option>
          </select>
        </div>
        <div class="form-group">
          <label for="docName">Name</label>
          <input type="text" id="docName" required />
        </div>
        <div class="form-group">
          <label for="docDescription">Description</label>
          <input type="text" id="docDescription" />
        </div>
        <div class="form-group">
          <label for="docTags">Tags (comma separated)</label>
          <input type="text" id="docTags" />
        </div>
        <div class="form-group">
          <label for="docContent">Content</label>
          <textarea id="docContent" rows="10"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="docEnabled" checked />
            Enabled
          </label>
        </div>
        <div class="panel-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="deleteDoc" class="btn btn-danger">Delete</button>
        </div>
      </form>
    </aside>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
